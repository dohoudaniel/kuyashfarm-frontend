name: CI

on:
  push:
    branches: [main, dohoudaniel]
  pull_request:

jobs:
  quality:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Type check
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      # The build is a real gate, not a formality: it is where Server Component
      # errors and bad `generateStaticParams` surface. It needs an API URL
      # because the client now refuses to guess one in production — a silent
      # localhost default means a misconfigured deploy fails in front of a
      # customer instead of here.
      #
      # No API is reachable in CI, so the catalogue and academy pages cannot
      # prerender. NEXT_PRERENDER_OFFLINE lets those pages fall back to an empty
      # state rather than failing the build; it is never set in a real deploy,
      # where an unreachable API *should* stop the release.
      - name: Build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.invalid/api/v1
          NEXT_PRERENDER_OFFLINE: "1"
        run: npm run build

      # NEXT_PUBLIC_* is inlined into the bundle and served to every visitor.
      # A secret placed there is public the moment it ships, and the mistake is
      # invisible in review — so it is checked mechanically.
      - name: No secrets in the client bundle
        run: node scripts/check-bundle-secrets.mjs

  # ── End-to-end ────────────────────────────────────────────────────────────
  # Drives a real browser against a real Django API. Nothing is mocked, because
  # every expensive bug in this project has been the two sides disagreeing about
  # a contract, and a mock agrees with whatever you tell it to.
  #
  # PREREQUISITE: this checks out the backend repository. If it is private, add
  # a `BACKEND_REPO_TOKEN` secret with read access to it — without one this job
  # fails at checkout rather than silently skipping, which is the intent.
  e2e:
    name: End-to-end
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kuyash
          POSTGRES_PASSWORD: kuyash
          POSTGRES_DB: kuyash
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kuyash"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    steps:
      - name: Check out the frontend
        uses: actions/checkout@v5
        with:
          path: frontend

      # The end-to-end suite runs the real API, which lives in a second,
      # private repository.
      #
      # `github.token` is scoped to *this* repository only, so the fallback
      # below cannot read a private one — the checkout fails with a bare
      # "Not Found", which reads like a typo in the repository name rather
      # than a permissions problem.
      #
      # Needs a fine-grained personal access token with **Contents: read** on
      # dohoudaniel/kuyashfarm-backend, stored as the BACKEND_REPO_TOKEN
      # secret. The step below says so out loud rather than failing obscurely.
      - name: Check for the backend access token
        run: |
          if [ -z "${{ secrets.BACKEND_REPO_TOKEN }}" ]; then
            echo "::error::BACKEND_REPO_TOKEN is not set. The end-to-end suite needs to check out"
            echo "::error::dohoudaniel/kuyashfarm-backend, which is private. Create a fine-grained"
            echo "::error::PAT with Contents: read on that repository and add it as a secret here."
            exit 1
          fi

      - name: Check out the backend
        uses: actions/checkout@v5
        with:
          repository: dohoudaniel/kuyashfarm-backend
          path: backend
          token: ${{ secrets.BACKEND_REPO_TOKEN }}

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Start the API
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: ci-only-secret-not-used-anywhere-real
          DJANGO_DEBUG: "True"
          DATABASE_URL: postgresql://kuyash:kuyash@localhost:5432/kuyash
          DB_SCHEMA: kuyash
          REDIS_URL: redis://localhost:6379/0
          # 3100 is where Playwright serves the frontend. Without it the browser
          # preflight blocks every request and the failures look like bugs.
          CORS_ALLOWED_ORIGINS: http://localhost:3100,http://127.0.0.1:3100
          CELERY_TASK_ALWAYS_EAGER: "True"
          # The suite makes more auth calls in a minute than any real person
          # would. A 429 here would look like a product bug; the limiter itself
          # is covered by the backend's tests/test_throttling.py.
          THROTTLE_LOGIN: 200/min
          THROTTLE_ANON: 600/min
        run: |
          uv sync --locked
          uv run python manage.py ensure_schema
          uv run python manage.py migrate --noinput
          uv run python manage.py seed_catalogue
          uv run python manage.py seed_academy
          # The staff and driver accounts the back-office specs sign in as.
          # They cannot be created through the API: registration only ever
          # produces a CUSTOMER, deliberately, so a browser test has no way to
          # bootstrap one. The command refuses to run with DEBUG off.
          uv run python manage.py seed_e2e
          uv run python manage.py runserver 8000 --noreload &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/v1/health/ >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/api/v1/health/

      # No build step here on purpose. `playwright.config.ts` builds the
      # frontend itself, because `NEXT_PUBLIC_API_URL` is inlined at build time
      # — a build done separately can be given a different value from the one
      # the suite runs against, and the mismatch is silent: the two become
      # cross-site, the SameSite=Lax refresh cookie is never sent, and every
      # page load lands signed-out. Building in one place removes the chance.
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      - name: Run end-to-end tests
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
          E2E_API_URL: http://127.0.0.1:8000/api/v1
        run: npm run test:e2e

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
